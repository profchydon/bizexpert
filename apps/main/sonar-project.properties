# Project identification
sonar.projectKey=dev-remote-ui
sonar.scm.provider=git

# Source code configuration - multiple sources separated by commas
sonar.sources=src
# sonar.tests=e2e

# Exclusions
sonar.exclusions=**/dist/**,**/node_modules/**,**/coverage/**,**/owasp-reports/**,**/.git/**,**/.github/**,**/.vscode/**,**/.husky/**

# Test configuration
sonar.typescript.lcov.reportPaths=coverage/lcov.info